<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MCP Hub</title>
    <link rel="stylesheet" href="/assets/styles.css">
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>MCP Hub</h1>
          <div id="configPath" class="subtle"></div>
        </div>
        <div class="top-actions">
          <button id="refreshBtn" class="icon-button" title="Refresh">R</button>
          <button id="addOpenBtn" class="primary-button">Add Server</button>
          <button id="scanBtn" class="primary-button">Scan</button>
        </div>
      </header>

      <main class="layout">
        <aside class="sidebar">
          <section class="panel">
            <div class="panel-head">
              <h2>Catalog</h2>
            </div>
            <div class="stats-grid">
              <div class="stat">
                <div id="serverCount" class="stat-value">0</div>
                <div class="stat-label">Servers</div>
              </div>
              <div class="stat">
                <div id="enabledCount" class="stat-value">0</div>
                <div class="stat-label">Enabled</div>
              </div>
              <div class="stat">
                <div id="stdioCount" class="stat-value">0</div>
                <div class="stat-label">Stdio</div>
              </div>
              <div class="stat">
                <div id="remoteCount" class="stat-value">0</div>
                <div class="stat-label">Actions</div>
              </div>
            </div>
          </section>

          <section id="addPanel" class="panel">
            <div class="panel-head">
              <h2>Add MCP Server</h2>
            </div>
            <label class="field-label" for="addName">Name</label>
            <input id="addName" type="text" placeholder="server-name">
            <label class="field-label" for="addTransport">Transport</label>
            <select id="addTransport">
              <option value="stdio">stdio</option>
              <option value="http">remote http</option>
            </select>
            <label class="field-label" for="addCommand">Command</label>
            <input id="addCommand" type="text" placeholder="python3 -m package.server">
            <label class="field-label" for="addUrl">URL</label>
            <input id="addUrl" type="text" placeholder="https://example.com/mcp">
            <label class="field-label" for="addProfile">Profile</label>
            <input id="addProfile" type="text" value="default">
            <label class="field-label" for="addTags">Tags</label>
            <input id="addTags" type="text" placeholder="local, tools">
            <button id="addBtn" class="wide-button primary-button">Add</button>
          </section>

          <section class="panel collapsed-panel">
            <details>
              <summary>Sync from client</summary>
              <label class="field-label" for="importClient">Client</label>
              <select id="importClient"></select>
              <label class="field-label" for="importPath">Path</label>
              <input id="importPath" type="text" placeholder="optional">
              <button id="importBtn" class="wide-button">Sync</button>
            </details>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Export</h2>
            </div>
            <label class="field-label" for="exportClient">Client</label>
            <select id="exportClient"></select>
            <button id="exportBtn" class="wide-button">Export</button>
          </section>
        </aside>

        <section class="workspace">
          <div class="workspace-head">
            <div>
              <h2 id="activeTitle">MCP Servers</h2>
              <div id="summaryLine" class="subtle"></div>
            </div>
            <div class="toolbar">
              <label class="inline-field">
                <span>Profile</span>
                <select id="profileFilter"></select>
              </label>
              <input id="searchBox" class="search" type="search" placeholder="Search servers">
            </div>
          </div>

          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Transport</th>
                  <th>Target</th>
                  <th>Actions</th>
                  <th>Profiles</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="serversTable"></tbody>
            </table>
          </div>

          <section class="details">
            <div class="panel-head">
              <h2>Details</h2>
              <button id="deleteBtn" class="danger-button">Delete</button>
            </div>
            <div id="detailsBody" class="details-body"></div>
          </section>
        </section>
      </main>
    </div>

    <dialog id="exportDialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>Export</h2>
          <button class="icon-button" value="cancel" title="Close">X</button>
        </div>
        <pre id="exportOutput"></pre>
      </form>
    </dialog>

    <div id="toast" class="toast"></div>
    <script src="/assets/app.js"></script>
  </body>
</html>
