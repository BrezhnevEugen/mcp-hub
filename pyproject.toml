[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-hub"
version = "0.1.0"
description = "Personal registry and operations CLI for MCP servers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Evgeny Brezhnev" }
]
dependencies = [
  "certifi>=2024.0.0",
  "PyYAML>=6.0.1"
]

[project.optional-dependencies]
test = [
  "pytest>=8.0"
]

[project.scripts]
mcp-hub = "mcp_hub.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_hub = ["ui/*"]
